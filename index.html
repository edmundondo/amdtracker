<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deal Tracker — WhatsApp Group Projects</title>

<body>
<div class="wrap">
  <section class="hero">
  <header>
    <div class="eyebrow">WhatsApp Group → Project Tracker</div>
    <h1>Deal Tracker</h1>
    <div class="subtitle">4 groups, read as 4 live projects · last synced from chat exports</div>
    <div class="print-meta" id="print-meta"></div>
  </header>
  </section>

  <section class="overview">
  <div class="stats" id="stats"></div>

  <div class="top-row">
    <div class="donut-block" id="donut-block"></div>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search projects, tasks, or owners…" oninput="onSearch(this.value)">
    </div>
    <button class="pdf-btn" onclick="exportPDF()">📄 Export PDF Report</button>
    <button class="csv-btn" onclick="exportCSV()">📊 Export Excel (CSV)</button>
    <button class="epub-btn" onclick="exportEPUB()">📚 Export EPUB</button>
    <button class="sync-btn" onclick="loadRemoteNotes()">🔄 Sync Reviewer Notes</button>
  </div>

  <div class="filters" id="filters"></div>

  </section>

  <section class="tasks">
  <div class="grid" id="grid"></div>
  </section>

  <footer>Click a project row to expand · click any status pill to cycle done → in progress → not started · search and filter above</footer>
</div>

<script>
const PROJECTS = [
  {
    name: "Zim Gold Mine (Prifex)",
    purpose: "Offtake/investment deal — Prifex Mining gold operation, Mazowe, Zimbabwe",
    priority: "high",
    caution: false,
    whatsappLink: "https://chat.whatsapp.com/FDz8EHFXDaa5ULZljLEeHA?mode=gi_t",
    notes: [
      { author: "Example Reviewer", date: "Jul 24", text: "NDA terms look standard — let's get confirmation on the export protocol timeline before the next call.", example: true }
    ],
    tasks: [
      ["Confirm Yunis (Director, Prifex Mining) availability for intro call", "Chico", "done", "Confirmed 4pm Harare time"],
      ["Schedule & hold intro call between both parties", "Chico / Markus", "done", "Held 7/10, all parties on"],
      ["Review geological + mining plan documents", "Markus Schneider", "done", "\"very interesting… let's schedule a call\""],
      ["Review amended NDA", "Chico", "done", "Tanya: \"terms are standard and fair\""],
      ["Sign NDA", "Markus Schneider", "done", "Fully signed version shared 7/20"],
      ["Review Prifex Mining overview doc (7pp)", "Y.Omar / Tanya", "done", "Shared by Omar, Tanya thanked"],
      ["Confirm Zimbabwe gold export protocol requirements", "Liam / Chico", "progress", "Liam: \"the Zim export protocols are the key\""],
      ["Review Executive Summary PDF", "Markus Schneider", "progress", "Shared 7/24, Markus traveling — review pending"],
    ]
  },
  {
    name: "Peter Mine Project (Kasimure)",
    purpose: "Kasimure Gold Prospect development — term sheet/LOI negotiation, Zimbabwe",
    priority: "high",
    caution: false,
    whatsappLink: "https://chat.whatsapp.com/HVuS9H2X8Mu0OxtsnMKEqq?mode=gi_t",
    notes: [],
    tasks: [
      ["Review geological/geophysical reports & resource estimation", "Markus Schneider", "done", "\"thanks Eddie — I will have a look\""],
      ["Complete New Mine Info Sheet form", "Peter Bamhare", "done", "Completed PDF returned 6/13"],
      ["Schedule & hold project status call", "Martin / Markus / Liam", "done", "Video call held 7/14"],
      ["Send mine address & email for NDA", "Peter Bamhare", "done", "Kasimure Mine, Karoi, Zimbabwe"],
      ["Draft & send NDA to Peter", "Liam", "progress", "Address received, NDA not yet confirmed sent"],
    ]
  },
  {
    name: "United Mines",
    purpose: "Equipment-lease-for-offtake financing model (SMG) for Zimbabwe gold mines",
    priority: "medium",
    caution: false,
    whatsappLink: "https://chat.whatsapp.com/EQ8M3Efksu1JRlXHxq4rL8?mode=gi_t",
    notes: [],
    tasks: [
      ["Share partnership proposal & mine info sheet", "Eddie Ed", "done", "Docs shared 6/29"],
      ["Answer Mundai's structuring/investment questions", "Markus Schneider", "done", "Answered w/ lease-for-offtake model + company profile"],
      ["Review brownfield reprocessing opportunity (5,000t tailings)", "Markus Schneider", "progress", "Mundai flagged 7/16: \"let us have a look and revert\""],
      ["Decide equipment scope: regrind/reprocess vs. combined expansion", "Markus Schneider", "notstarted", "Needs tipper truck, ball mill, TLB"],
    ]
  },
  {
    name: "Billy Leonardi Mine Projects",
    purpose: "Unsolicited gold off-take pitch (Zambia) + separate Uganda mine investment pitch",
    priority: "low",
    caution: true,
    whatsappLink: "https://chat.whatsapp.com/Bqlcl9VmRvN8FHU7YLJZ8a?mode=gi_t",
    notes: [],
    tasks: [
      ["Verify gold off-take proposal before any advance payment", "Team", "notstarted", "Unsolicited request for 2–4kg advance gold payment before delivery"],
      ["Evaluate Uganda mine investment pitch", "Team", "notstarted", "Vague claims + political-connection name-dropping"],
    ]
  }
];

function countBy(tasks) {
  const c = { done: 0, progress: 0, notstarted: 0 };
  tasks.forEach(t => c[t[2]]++);
  return c;
}

function overallCounts() {
  let total = 0, done = 0, progress = 0, notstarted = 0;
  PROJECTS.forEach(p => {
    const c = countBy(p.tasks);
    total += p.tasks.length; done += c.done; progress += c.progress; notstarted += c.notstarted;
  });
  return { total, done, progress, notstarted };
}

function renderStats() {
  const { total, done, progress, notstarted } = overallCounts();
  const stats = [
    { num: PROJECTS.length, lbl: "Projects", cls: "" },
    { num: total, lbl: "Total Tasks", cls: "" },
    { num: done, lbl: "Done", cls: "done" },
    { num: progress, lbl: "In Progress", cls: "progress" },
    { num: notstarted, lbl: "Not Started", cls: "notstarted" },
  ];
  document.getElementById("stats").innerHTML = stats.map(s =>
    `<div class="stat ${s.cls}"><div class="num">${s.num}</div><div class="lbl">${s.lbl}</div></div>`
  ).join("");
}

function renderDonut() {
  const { total, done, progress, notstarted } = overallCounts();
  const r = 30, circ = 2 * Math.PI * r;
  const dDone = total ? (done/total)*circ : 0;
  const dProg = total ? (progress/total)*circ : 0;
  const dNS = total ? (notstarted/total)*circ : 0;
  let offset = 0;
  const seg = (len, color, off) => `<circle r="${r}" cx="40" cy="40" fill="none" stroke="${color}" stroke-width="10"
      stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-off}" transform="rotate(-90 40 40)"/>`;
  const svg = `
    <svg width="80" height="80" viewBox="0 0 80 80">
      <circle r="${r}" cx="40" cy="40" fill="none" stroke="#2C333E" stroke-width="10"/>
      ${seg(dDone, "#01AA47", offset)}
      ${offset += dDone, seg(dProg, "#FFC000", offset)}
      ${offset += dProg, seg(dNS, "#E5484D", offset)}
      <text x="40" y="45" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#F2F0EA">${total ? Math.round(done/total*100) : 0}%</text>
    </svg>`;
  const legend = `
    <div class="donut-legend">
      <div><span class="sw" style="background:#01AA47"></span>Done — ${done}</div>
      <div><span class="sw" style="background:#FFC000"></span>In Progress — ${progress}</div>
      <div><span class="sw" style="background:#E5484D"></span>Not Started — ${notstarted}</div>
    </div>`;
  document.getElementById("donut-block").innerHTML = svg + legend;
}

let currentFilter = "all";
let searchTerm = "";

function onSearch(v) {
  searchTerm = v.trim().toLowerCase();
  renderGrid();
}

function cycleStatus(projIdx, taskIdx, ev) {
  ev.stopPropagation();
  const order = ["notstarted", "progress", "done"];
  const t = PROJECTS[projIdx].tasks[taskIdx];
  const next = order[(order.indexOf(t[2]) + 1) % order.length];
  t[2] = next;
  renderStats();
  renderDonut();
  renderGrid();
  const card = document.querySelector(`.card[data-idx="${projIdx}"]`);
  if (card) card.classList.add("open");
}

function renderFilters() {
  const opts = [["all","All Projects"],["high","High Priority"],["medium","Medium Priority"],["low","Low Priority"],["caution","⚠ Caution"]];
  document.getElementById("filters").innerHTML = opts.map(([key,label]) =>
    `<button class="filter-btn${key===currentFilter?' active':''}" data-key="${key}">${label}</button>`
  ).join("");
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentFilter = btn.dataset.key;
      renderFilters();
      renderGrid();
    });
  });
}

function statusLabel(s) {
  return s === "done" ? "Done" : s === "progress" ? "In Progress" : "Not Started";
}

function matchesSearch(p) {
  if (!searchTerm) return true;
  const haystack = [p.name, p.purpose, ...p.tasks.flatMap(t => [t[0], t[1], t[3]])]
    .join(" ").toLowerCase();
  return haystack.includes(searchTerm);
}

function renderGrid() {
  const grid = document.getElementById("grid");
  let anyVisible = false;

  grid.innerHTML = PROJECTS.map((p, idx) => {
    const c = countBy(p.tasks);
    const total = p.tasks.length;
    const pct = k => total ? (c[k]/total*100) : 0;
    const passesFilter = currentFilter === "all" || p.priority === currentFilter || (currentFilter === "caution" && p.caution);
    const passesSearch = matchesSearch(p);
    const visible = passesFilter && passesSearch;
    if (visible) anyVisible = true;
    const stripeClass = p.caution ? "caution" : p.priority;

    const rows = p.tasks.map((t, tIdx) => `
      <tr>
        <td class="task-name">${t[0]}</td>
        <td class="task-owner">${t[1]}</td>
        <td><span class="status-pill ${t[2]}" onclick="cycleStatus(${idx},${tIdx},event)" title="Click to change status">${statusLabel(t[2])}</span></td>
        <td class="task-notes">${t[3]}</td>
      </tr>`).join("");

    const cautionBanner = p.caution ? `<div class="caution-banner"><b>⚠ Caution:</b> this group shows patterns commonly seen in advance-fee gold scams — unsolicited outreach, a request for payment/gold in advance of delivery, and unverifiable claims. Verify independently before committing anything.</div>` : "";

    return `
    <div class="card${visible?'':' hidden'}" data-idx="${idx}">
      <div class="core-stripe ${stripeClass}"></div>
      <div class="card-head" onclick="toggleCard(${idx})">
        <div class="card-title-block">
          <div class="card-title">
            ${p.name}
            <span class="badge ${p.priority}">${p.priority}</span>
            ${p.caution ? '<span class="caution-flag">⚠ review</span>' : ''}
          </div>
          <div class="card-purpose">${p.purpose}</div>
        </div>
        <div class="card-right">
          <div class="progress-block">
            <div class="progress-num"><b>${c.done}</b>/${total} done</div>
            <div class="progress-bar">
              <div class="seg done" style="width:${pct('done')}%"></div>
              <div class="seg progress" style="width:${pct('progress')}%"></div>
              <div class="seg notstarted" style="width:${pct('notstarted')}%"></div>
            </div>
          </div>
          ${p.whatsappLink
            ? `<a class="wa-link" href="${p.whatsappLink}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">🔗 Open in WhatsApp</a>`
            : `<span class="wa-link disabled" title="No invite link added yet">🔗 No link yet</span>`}
          <div class="chevron">▶</div>
        </div>
      </div>
      <div class="task-panel">
        <div class="task-panel-inner">
          ${cautionBanner}
          <table>
            <thead><tr><th>Task</th><th>Owner</th><th>Status</th><th>Notes</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="notes-section">
            <div class="notes-header">💬 Reviewer Notes</div>
            <div class="notes-list" id="notes-list-${idx}">${renderNotesHTML(p.notes)}</div>
            <div class="notes-form">
              <a class="form-link" href="${FORM_URL}" target="_blank" rel="noopener noreferrer">📝 Add a note via Google Form</a>
              <div class="form-hint">Type exactly this in the Project field: <code>${p.name}</code></div>
              <div class="edit-hint">Made a mistake? After submitting, Google Forms shows an "Edit your response" link on the confirmation page — use that to fix or update your note instead of resubmitting.</div>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }).join("") + (anyVisible ? "" : `<div class="no-results">No projects match "${searchTerm}" with the current filter.</div>`);
}

function toggleCard(idx) {
  const card = document.querySelector(`.card[data-idx="${idx}"]`);
  card.classList.toggle("open");
}

function renderNotesHTML(notes) {
  if (!notes || notes.length === 0) {
    return `<div class="no-notes">No reviewer notes yet — be the first to add one.</div>`;
  }
  return notes.map(n => {
    let ndaBadge = "";
    if (n.nda) {
      const isYes = n.nda.toLowerCase().startsWith("y");
      ndaBadge = `<span class="nda-badge ${isYes ? 'nda-yes' : 'nda-no'}">NDA: ${isYes ? '✓ Signed' : '✗ Not signed'}</span>`;
    }
    return `
    <div class="note-item">
      <div class="note-avatar">${n.author.trim().charAt(0).toUpperCase()}</div>
      <div class="note-body">
        <div class="note-meta"><b>${n.author}</b> · ${n.date}${n.example ? '<span class="example-tag">Example</span>' : ''} ${ndaBadge}</div>
        <div class="note-text">${n.text}</div>
      </div>
    </div>`;
  }).join("");
}

const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScvjBbvgWGFmw_jG1MKosamwgCD4DPhHTkobUI075Y4zbPT0Q/viewform";
const NOTES_GVIZ_URL = "https://docs.google.com/spreadsheets/d/18wlWY20NFrGCCCS5tdS2DG-VzWS9PxsHkjNsV2hAHG8/gviz/tq?tqx=out:csv&sheet=Form_Responses";
const NOTES_PUB_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOuvMVx_CoI8JLrCroXxrclucg81jEoNoZIabzE8Mra38Y9OphfyPwVhy5FOy68T0CAgUh8f2O53X-/pub?output=csv";

function fetchNotesCSV() {
  return fetch(NOTES_GVIZ_URL)
    .then(r => { if (!r.ok) throw new Error("gviz HTTP " + r.status); return r.text(); })
    .catch(() => fetch(NOTES_PUB_CSV_URL).then(r => {
      if (!r.ok) throw new Error("pub HTTP " + r.status);
      return r.text();
    }));
}

function formatDateMDY(raw) {
  if (!raw) return "";
  const d = new Date(raw);
  if (isNaN(d.getTime())) return raw; // couldn't parse — show whatever was there rather than break
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  const yyyy = d.getFullYear();
  return `${mm}/${dd}/${yyyy}`;
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r") { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function loadRemoteNotes() {
  fetchNotesCSV()
    .then(text => {
      const rows = parseCSV(text);
      if (rows.length < 2) return;
      const header = rows[0].map(h => h.trim().toLowerCase());
      const iProject = header.indexOf("project");
      const iReviewer = header.indexOf("reviewer");
      const iDate = header.indexOf("date");
      const iNote = header.indexOf("note");
      const iEmail = header.findIndex(h => h.includes("email"));
      const iPhone = header.findIndex(h => h.includes("phone"));
      const iNda = header.findIndex(h => h.includes("nda"));
      if (iProject === -1) return;
      PROJECTS.forEach(p => { p.notes = []; });
      rows.slice(1).forEach(r => {
        const projVal = (r[iProject] || "").trim();
        if (!projVal) return;
        const match = PROJECTS.find(p =>
          p.name.toLowerCase().includes(projVal.toLowerCase()) ||
          projVal.toLowerCase().includes(p.name.toLowerCase())
        );
        if (!match) return;
        match.notes.push({
          author: (r[iReviewer] || "Anonymous").trim(),
          date: formatDateMDY((r[iDate] || "").trim()),
          text: (r[iNote] || "").trim(),
          email: iEmail > -1 ? (r[iEmail] || "").trim() : "",
          phone: iPhone > -1 ? (r[iPhone] || "").trim() : "",
          nda: iNda > -1 ? (r[iNda] || "").trim() : ""
        });
      });
      renderGrid();
    })
    .catch(err => console.warn("Could not load reviewer notes:", err));
}

function exportPDF() {
  document.querySelectorAll(".card").forEach(c => c.classList.add("open"));
  const stamp = document.getElementById("print-meta");
  if (stamp) {
    const now = new Date();
    stamp.textContent = "Report generated " + now.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  }
  setTimeout(() => window.print(), 60);
}

function csvCell(v) {
  const s = String(v == null ? "" : v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportCSV() {
  const rows = [["Project", "Priority", "Task", "Owner", "Status", "Task Notes"]];
  PROJECTS.forEach(p => {
    p.tasks.forEach(t => {
      rows.push([p.name, p.priority, t[0], t[1], statusLabel(t[2]), t[3]]);
    });
  });
  rows.push([]);
  rows.push(["Project", "Reviewer", "Date", "Reviewer Note"]);
  PROJECTS.forEach(p => {
    (p.notes || []).forEach(n => {
      rows.push([p.name, n.author, n.date, n.text]);
    });
  });
  const csv = rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "Mining_Deal_Tracker_" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function escXml(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STATUS_COLOR = { done: "#01AA47", progress: "#B8860B", notstarted: "#C0392B" };

function chapterXhtml(p) {
  let cautionHtml = "";
  if (p.caution) {
    cautionHtml = `<div class="caution">&#9888; <strong>Caution:</strong> this group shows patterns commonly seen in advance-fee gold scams &#8212; unsolicited outreach, a request for payment/gold in advance of delivery, and unverifiable claims. Verify independently before committing anything.</div>`;
  }
  const rows = p.tasks.map(t => {
    const [task, owner, status, note] = t;
    const color = STATUS_COLOR[status] || "#333";
    return `<tr><td>${escXml(task)}</td><td>${escXml(owner)}</td><td><span style="color:${color};font-weight:bold;">${escXml(statusLabel(status))}</span></td><td class="notes">${escXml(note)}</td></tr>`;
  }).join("\n");
  let notesHtml;
  if (p.notes && p.notes.length) {
    const items = p.notes.map(n => `<li><strong>${escXml(n.author)}</strong> (${escXml(n.date)}): ${escXml(n.text)}</li>`).join("\n");
    notesHtml = `<h3>Reviewer Notes</h3><ul class="reviewer-notes">${items}</ul>`;
  } else {
    notesHtml = `<h3>Reviewer Notes</h3><p class="no-notes"><em>No reviewer notes yet.</em></p>`;
  }
  return `<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head><title>${escXml(p.name)}</title><link rel="stylesheet" type="text/css" href="style.css"/></head>
<body>
<h1>${escXml(p.name)}</h1>
<p class="purpose">${escXml(p.purpose)}</p>
<p class="badge">Priority: <strong>${escXml(p.priority)}</strong></p>
${cautionHtml}
<table>
<thead><tr><th>Task</th><th>Owner</th><th>Status</th><th>Notes</th></tr></thead>
<tbody>
${rows}
</tbody>
</table>
${notesHtml}
</body>
</html>`;
}
